<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>For Sweety ❤️</title>

  <!-- Handwritten font -->
  <link href="https://fonts.googleapis.com/css2?family=Great+Vibes&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="style.css">
</head>

<body ontouchstart="playMusic()" onclick="playMusic()">

<audio id="bgMusic" loop>
  <source src="music/inna-sona.mp3" type="audio/mpeg">
</audio>

<div class="overlay"></div>
<div class="stars"></div>
<div class="petals"></div>

<div class="container">

  <h1 class="glow fade">Sweety ❤️</h1>

  <!-- Shayari -->
  <p class="typewriter" id="loveText"></p>

  <!-- Image slider -->
  <div class="slider fade">
    <img id="slide" src="images/img1.jpg">
  </div>

  <!-- Statement -->
  <h2 class="statement fade">
    I choose you.<br>
    Today. Tomorrow. Always.
  </h2>

  <!-- Ring -->
  <div class="ring">💍</div>

  <!-- Handwritten signature -->
  <div class="handwritten">
    Forever Yours ❤️<br>
    <span class="name">— Rajeev</span>
  </div>

</div>

<script src="script.js"></script>
</body>
</html>
